name: Buckets
options:
  bundleIdPrefix: com.sacredtreeservice
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
targets:
  Buckets:
    type: application
    platform: macOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sacredtreeservice.buckets
        PRODUCT_NAME: Buckets
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.business
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Sacred Tree Service LLC"
        MARKETING_VERSION: "0.2.1"
        CURRENT_PROJECT_VERSION: "3"
  BucketsTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    dependencies:
      - target: Buckets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sacredtreeservice.buckets.tests
  BucketsUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [UITests]
    dependencies:
      - target: Buckets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sacredtreeservice.buckets.uitests
        TEST_TARGET_NAME: Buckets
